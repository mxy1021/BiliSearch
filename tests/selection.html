<h1>BiliSearch 手动验收页</h1>
<p>用鼠标选中下面一行文字并右键，点击“在 Bilibili 搜索…”；核对新标签页关键词，再返回检查此页仍然存在。</p>
<p class="sample">中文教程</p>
<p class="sample">JavaScript tutorial</p>
<p class="sample">C# ASP.NET Core 教程</p>
<p class="sample">a&amp;b=c?x#y+z/%</p>
<p class="sample">表情🙂 🚀</p>
<p>点击空白区域取消选择，再右键：不应出现 BiliSearch。重新加载扩展后重复测试，菜单应只有一个。</p>
